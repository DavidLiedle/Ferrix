[package]
name = "ferrix"
version = "1.0.0"
edition = "2021"
authors = ["David Liedle", "Claude <noreply@anthropic.com>"]
description = "A modern terminal multiplexer built with Rust, inspired by tmux and GNU Screen"
license = "MIT OR Apache-2.0"
repository = "https://github.com/davidliedle/Ferrix"
keywords = ["terminal", "multiplexer", "tmux", "screen", "tui"]
categories = ["command-line-utilities"]

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = { version = "1.8", features = ["serde"] }
async-trait = "0.1"

# Terminal handling
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui = "0.29"

# PTY handling
portable-pty = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bincode = "1.3"

# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
rpassword = "7.3"

[target.'cfg(unix)'.dependencies]
daemonize = "0.5"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# IPC
interprocess = "2.2"

# Utils
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
once_cell = "1.20"
dirs = "5.0"
hostname = "0.4"
rand = "0.8"
dashmap = "6.1"  # Lock-free concurrent HashMap for session management

# ============================================================================
# CONDITIONAL DEPENDENCIES (feature-gated)
# ============================================================================

# Core features (always available)
regex = "1.10"
notify = "6.1"
sysinfo = "0.32"

# Tier 1: Core features (always enabled)
arboard = "3.4"                                                   # clipboard
# scrollback has no dependencies
flate2 = "1.0"                                                    # recording
md5 = "0.7"                                                       # recording

# Tier 2: Advanced features

rustls = { version = "0.23", optional = true }                    # remote
tokio-rustls = { version = "0.26", optional = true }              # remote
rustls-pemfile = { version = "2.2", optional = true }             # remote
webpki-roots = { version = "0.26", optional = true }              # remote
bcrypt = { version = "0.15", optional = true }                    # remote
ssh2 = { version = "0.9", optional = true }                       # ssh
# performance has no dependencies
# mosh has no additional dependencies (uses tokio UDP)

# Tier 3: Experimental features
git2 = { version = "0.19", features = ["vendored-openssl"], optional = true }  # versioning
# collaboration has no dependencies
# time-travel has no dependencies

wasmtime = { version = "27.0", optional = true }                  # plugin
wasmtime-wasi = { version = "27.0", optional = true }             # plugin
semver = { version = "1.0", optional = true }                     # plugin
sha2 = { version = "0.10", optional = true }                      # plugin
tar = { version = "0.4", optional = true }                        # plugin
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }  # plugin + ai-assist

# Tier 4: UI enhancements
wgpu = { version = "23.0", optional = true }                      # gpu
raw-window-handle = { version = "0.6", optional = true }          # gpu
winit = { version = "0.30", optional = true }                     # gpu
bytemuck = { version = "1.20", features = ["derive"], optional = true }  # gpu
fontdue = { version = "0.9", optional = true }                    # gpu - font rasterization
battery = { version = "0.7", optional = true }                    # battery-status

[dev-dependencies]
criterion = "0.5"
tempfile = "3.14"
pretty_assertions = "1.4"

[[bench]]
name = "startup"
harness = false

[[bench]]
name = "large_output"
harness = false

[[bench]]
name = "performance"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[profile.bench]
inherits = "release"

[features]
# ============================================================================
# FEATURE FLAG ARCHITECTURE - Option B Strategy
# ============================================================================
# Default: Minimal build (like tmux) - just core multiplexing
# Opt-in: Power users enable advanced features as needed
#
# Build Examples:
#   cargo build                           # Minimal (5-6MB)
#   cargo build --features full           # Everything (9.7MB)
#   cargo build --features remote,plugin  # À la carte
# ============================================================================

# Default: CORE MULTIPLEXING
# Note: clipboard, scrollback, and recording are ALWAYS enabled (too deeply integrated)
default = []

# Full: Everything enabled (for power users who want it all)
full = [
    "remote", "ssh", "mosh", "versioning",
    "collaboration", "time-travel", "plugin", "ai-assist",
    "gpu", "battery-status"
]

# ============================================================================
# TIER 1: Core Features (ALWAYS ENABLED - too fundamental to be optional)
# ============================================================================
# clipboard - Copy/paste support (arboard dependency always included)
# scrollback - Scrollback buffer (no extra deps, core functionality)
# recording - Session recording (flate2, md5 dependencies always included)

# ============================================================================
# TIER 2: Advanced Features (stable but adds complexity)
# ============================================================================
remote = [                             # TCP/TLS remote access
    "dep:rustls", "dep:tokio-rustls",
    "dep:rustls-pemfile", "dep:webpki-roots",
    "dep:bcrypt"
]
ssh = ["dep:ssh2"]                     # SSH tunnel support
mosh = []                              # Mosh-style UDP transport
performance = []                       # Advanced output batching/compression

# ============================================================================
# TIER 3: Experimental Features (may have rough edges)
# ============================================================================
versioning = ["dep:git2"]              # Git-like session versioning
collaboration = []                     # Real-time collaborative editing
time-travel = []                       # Time-travel debugging/replay
plugin = [                             # WASM plugin system
    "dep:wasmtime", "dep:wasmtime-wasi",
    "dep:reqwest", "dep:semver", "dep:sha2", "dep:tar"
]
ai-assist = ["dep:reqwest"]           # AI command suggestions

# ============================================================================
# TIER 4: UI Enhancements (cosmetic, high dependency cost)
# ============================================================================
gpu = [                                # GPU-accelerated rendering
    "dep:wgpu", "dep:raw-window-handle",
    "dep:winit", "dep:bytemuck", "dep:fontdue"
]
battery-status = ["dep:battery"]       # Battery info in status bar
                                       # ⚠️  Has nix vulnerability (RUSTSEC-2021-0119)

# ============================================================================
# Feature Groups (convenience aliases)
# ============================================================================
essential = []  # Core features (clipboard/scrollback/recording always included)
power-user = ["essential", "remote", "versioning", "performance"]
bleeding-edge = ["full"]
