[package]
name = "ferrix"
version = "0.7.4"
edition = "2021"
authors = ["David Liedle", "Claude <noreply@anthropic.com>"]
description = "A new Rust-based terminal multiplexer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/davidliedle/Ferrix"
keywords = ["terminal", "multiplexer", "tmux", "screen", "tui"]
categories = ["command-line-utilities"]

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1.8"
async-trait = "0.1"

# Terminal handling
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui = "0.29"

# PTY handling
portable-pty = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
bincode = "1.3"

# CLI
clap = { version = "4.5", features = ["derive"] }
rpassword = "7.3"
daemonize = "0.5"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# IPC
interprocess = "2.2"

# Utils
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
once_cell = "1.20"
dirs = "5.0"
hostname = "0.4"

# Plugin system
wasmtime = "27.0"
wasmtime-wasi = "27.0"

# Clipboard
arboard = "3.4"

# System info for status bar
sysinfo = "0.32"
battery = "0.7"

# Git integration for status bar
git2 = { version = "0.19", features = ["vendored-openssl"] }

# Compression for snapshots
flate2 = "1.0"

# Checksum for snapshots
md5 = "0.7"

# Password hashing
bcrypt = "0.15"

# File watching for config reload
notify = "6.1"

# TLS for remote sessions
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2.2"
webpki-roots = "0.26"

# GPU acceleration
wgpu = { version = "23.0", optional = true }
raw-window-handle = { version = "0.6", optional = true }
winit = { version = "0.30", optional = true }
bytemuck = { version = "1.20", features = ["derive"], optional = true }

[dev-dependencies]
criterion = "0.5"
tempfile = "3.14"
pretty_assertions = "1.4"

[[bench]]
name = "startup"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[profile.bench]
inherits = "release"

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:raw-window-handle", "dep:winit", "dep:bytemuck"]
